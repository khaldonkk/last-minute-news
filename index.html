<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta name="google-site-verification" content="3_GSBczhIHfHTtxrlAjHane03pNIn0zU4UrhP01GDiI" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>آخر دقيقة | Last Minute News</title>
  <meta name="description" content="آخر دقيقة — أخبار عاجلة ومحدثة لحظة بلحظة" />
  <meta name="theme-color" content="#E9314A" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@400;500;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            display: ['Cairo', 'sans-serif'],
            body: ['Tajawal', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            ink: {
              DEFAULT: '#12141C',
              light: '#F4F3EF',
            },
            paper: {
              DEFAULT: '#0B0E14',
              light: '#F0EFEA',
            },
            surface: {
              DEFAULT: '#141824',
              light: '#FFFFFF',
            },
            signal: '#E9314A',
            amber: '#F5A623',
            slate: {
              soft: '#8891A3',
            },
          },
          boxShadow: {
            card: '0 1px 0 0 rgba(0,0,0,0.04)',
            'card-hover': '0 8px 30px rgba(0,0,0,0.12)',
          },
        },
      },
    };
  </script>

  <style>
    html { scroll-behavior: smooth; }
    body { font-family: 'Tajawal', sans-serif; }
    .font-display { font-family: 'Cairo', sans-serif; }
    .font-mono-num { font-family: 'JetBrains Mono', monospace; direction: ltr; unicode-bidi: isolate; }

    /* ---- Ticker marquee ---- */
    .ticker-track {
      display: inline-flex;
      white-space: nowrap;
      animation: ticker-scroll 36s linear infinite;
    }
    .ticker-track:hover { animation-play-state: paused; }
    @keyframes ticker-scroll {
      0%   { transform: translateX(0%); }
      100% { transform: translateX(-50%); }
    }
    /* Fade edges on ticker */
    .ticker-mask {
      position: relative;
      overflow: hidden;
    }
    .ticker-mask::before,
    .ticker-mask::after {
      content: '';
      position: absolute;
      top: 0; bottom: 0;
      width: 50px;
      z-index: 2;
      pointer-events: none;
    }
    .ticker-mask::before {
      left: 0;
      background: linear-gradient(to right, #E9314A, transparent);
    }
    .ticker-mask::after {
      right: 0;
      background: linear-gradient(to left, #E9314A, transparent);
    }

    /* ---- Live pulse dot ---- */
    .pulse-dot { position: relative; }
    .pulse-dot::before {
      content: '';
      position: absolute; inset: 0;
      border-radius: 9999px;
      background: currentColor;
      opacity: .6;
      animation: pulse-ring 1.6s cubic-bezier(0.4,0,0.6,1) infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(1); opacity: .6; }
      75%, 100% { transform: scale(2.4); opacity: 0; }
    }

    /* ---- Card line clamp ---- */
    .clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

    /* ---- Skeleton shimmer ---- */
    .shimmer {
      background: linear-gradient(90deg, rgba(120,120,130,.12) 25%, rgba(120,120,130,.22) 37%, rgba(120,120,130,.12) 63%);
      background-size: 400% 100%;
      animation: shimmer 1.4s ease infinite;
    }
    @keyframes shimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

    /* ---- Smooth theme transitions ---- */
    body, .card, header, footer, input, button {
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
    }

    /* ---- Card entrance animation ---- */
    @keyframes card-in {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card-enter {
      animation: card-in 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    /* ---- Selection ---- */
    ::selection { background: #E9314A; color: #fff; }

    /* ---- Focus visible ---- */
    a:focus-visible, button:focus-visible, input:focus-visible {
      outline: 2px solid #E9314A;
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* ---- Reduced motion ---- */
    @media (prefers-reduced-motion: reduce) {
      .ticker-track, .pulse-dot::before, .shimmer, .card-enter {
        animation: none !important;
      }
      .card-enter { opacity: 1; transform: none; }
    }

    /* ---- Mobile bottom sheet ---- */
    .bottom-sheet {
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .bottom-sheet.open { transform: translateY(0); }

    /* ---- Toast notification ---- */
    @keyframes toast-in {
      from { opacity: 0; transform: translateY(20px) scale(0.95); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .toast-enter {
      animation: toast-in 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
  </style>
</head>

<body class="bg-paper-light dark:bg-paper text-ink dark:text-ink-light font-body transition-colors duration-300 min-h-screen">

  <!-- ===================== HEADER ===================== -->
  <header class="sticky top-0 z-40 backdrop-blur bg-paper-light/90 dark:bg-paper/90 border-b border-black/10 dark:border-white/10">
    <div class="max-w-6xl mx-auto px-4 sm:px-6">
      <div class="flex items-center justify-between h-16">

        <!-- Logo -->
        <a href="#" class="flex items-center gap-2.5 group" aria-label="الرئيسية">
          <span class="relative flex items-center justify-center w-9 h-9 rounded-lg bg-signal text-white text-lg shadow-sm">
            🔔
            <span class="pulse-dot absolute -top-1 -left-1 w-2.5 h-2.5 bg-signal rounded-full text-signal"></span>
          </span>
          <span class="font-display font-900 text-xl sm:text-2xl tracking-tight">
            آخر <span class="text-signal">دقيقة</span>
          </span>
        </a>

        <!-- Live clock + theme toggle -->
        <div class="flex items-center gap-3 sm:gap-4">
          <!-- Last update indicator -->
          <div id="update-status" class="hidden sm:flex items-center gap-2 text-xs text-slate-soft" title="آخر تحديث">
            <span class="w-1.5 h-1.5 rounded-full bg-signal animate-pulse"></span>
            <span id="live-clock" class="font-mono-num"></span>
          </div>
          <button id="theme-toggle" type="button"
            class="w-9 h-9 grid place-items-center rounded-lg border border-black/10 dark:border-white/15 hover:bg-black/5 dark:hover:bg-white/10 transition"
            aria-label="تبديل الوضع الداكن والفاتح">
            <span id="theme-icon" aria-hidden="true">🌙</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Breaking news ticker -->
    <div class="bg-signal text-white overflow-hidden relative">
      <div class="ticker-mask">
        <div class="max-w-6xl mx-auto flex items-stretch">
          <div class="flex items-center gap-1.5 px-3 sm:px-4 py-2 bg-black/15 font-display font-800 text-xs sm:text-sm shrink-0 whitespace-nowrap">
            <span class="pulse-dot relative w-1.5 h-1.5 bg-white rounded-full text-white"></span>
            عاجل
          </div>
          <div class="relative flex-1 overflow-hidden py-2">
            <div id="ticker" class="ticker-track text-xs sm:text-sm font-medium" aria-live="polite"></div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- ===================== SEARCH & FILTER ===================== -->
  <div class="max-w-6xl mx-auto px-4 sm:px-6 pt-6">
    <div class="flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
      <!-- Search -->
      <div class="relative w-full sm:max-w-sm">
        <input id="search-input" type="text" placeholder="ابحث في العناوين والملخصات…"
          class="w-full h-11 rounded-xl border border-black/10 dark:border-white/15 bg-white dark:bg-surface px-4 pr-10 text-sm placeholder:text-slate-soft focus:border-signal outline-none transition" />
        <span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-slate-soft text-sm" aria-hidden="true">🔎</span>
        <!-- Clear search button -->
        <button id="clear-search" type="button" class="hidden absolute left-3 top-1/2 -translate-y-1/2 text-slate-soft hover:text-signal transition"
          aria-label="مسح البحث" title="مسح">✕</button>
      </div>

      <!-- Filters row -->
      <div class="flex items-center gap-2">
        <div id="category-filters" class="flex flex-wrap gap-2 text-sm"></div>
        <!-- Bookmark filter -->
        <button id="bookmark-filter-btn" type="button"
          class="h-9 px-3 rounded-full border border-black/10 dark:border-white/15 hover:bg-black/5 dark:hover:bg-white/10 transition text-sm font-medium flex items-center gap-1.5"
          aria-label="القراءة لاحقا">
          <span aria-hidden="true">🔖</span>
          <span id="bookmark-count">0</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ===================== NEWS GRID ===================== -->
  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-8">
    <div class="flex items-center justify-between mb-4">
      <h1 class="font-display font-800 text-lg sm:text-xl">آخر الأخبار</h1>
      <div class="flex items-center gap-3 text-xs text-slate-soft">
        <span id="result-count" class="font-mono-num"></span>
        <span id="last-update" class="hidden sm:inline font-mono-num"></span>
      </div>
    </div>

    <div id="news-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5"></div>

    <!-- Empty state -->
    <div id="empty-state" class="hidden flex-col items-center justify-center text-center py-20">
      <div class="text-4xl mb-3">📭</div>
      <p class="font-display font-700 text-lg mb-1">لا توجد نتائج مطابقة</p>
      <p class="text-sm text-slate-soft">جرّب كلمة بحث مختلفة أو اختر تصنيفاً آخر</p>
    </div>

    <!-- Bookmark empty state -->
    <div id="bookmark-empty-state" class="hidden flex-col items-center justify-center text-center py-20">
      <div class="text-4xl mb-3">🔖</div>
      <p class="font-display font-700 text-lg mb-1">لا توجد مقالات محفوظة</p>
      <p class="text-sm text-slate-soft">اضغط على 🔖 لحفظ الأخبار للقراءة لاحقاً</p>
    </div>

    <!-- Load more -->
    <div id="load-more-wrapper" class="hidden text-center py-8">
      <button id="load-more-btn" type="button"
        class="h-11 px-8 rounded-xl border border-black/10 dark:border-white/15 hover:bg-black/5 dark:hover:bg-white/10 transition font-medium text-sm">
        عرض المزيد
      </button>
    </div>
  </main>

  <!-- ===================== FOOTER ===================== -->
  <footer class="border-t border-black/10 dark:border-white/10 mt-10">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-8 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs text-slate-soft">
      <p>© 2026 آخر دقيقة — جميع الأخبار مثال توضيحي لأغراض العرض.</p>
      <p id="refresh-info" class="font-mono-num">يُحدَّث كل 3 ساعات</p>
    </div>
  </footer>

  <!-- ===================== TOAST CONTAINER ===================== -->
  <div id="toast-container" class="fixed bottom-4 left-4 z-50 flex flex-col gap-2" aria-live="assertive"></div>

  <script>
    // ===================== STATE =====================
    let allNews = [];
    let filteredNews = [];
    let activeCategory = 'الكل';
    let searchTerm = '';
    let showBookmarksOnly = false;
    let visibleCount = 18;
    let bookmarks = JSON.parse(localStorage.getItem('lmn-bookmarks') || '[]');

    // ===================== CATEGORY STYLES =====================
    const CATEGORY_STYLES = {
      'اقتصاد':     { dot: 'bg-amber',   text: 'text-amber' },
      'رياضة':      { dot: 'bg-emerald-500', text: 'text-emerald-500' },
      'تقنية':      { dot: 'bg-sky-500', text: 'text-sky-500' },
      'محليات':     { dot: 'bg-slate-soft', text: 'text-slate-soft' },
      'صحة':        { dot: 'bg-teal-500', text: 'text-teal-500' },
      'عالم':       { dot: 'bg-violet-500', text: 'text-violet-500' },
      'أمن سيبراني': { dot: 'bg-red-500', text: 'text-red-500' },
    };
    const DEFAULT_STYLE = { dot: 'bg-slate-soft', text: 'text-slate-soft' };

    // ===================== HELPERS =====================
    function safeText(value, fallback) {
      if (value === undefined || value === null) return fallback;
      const str = String(value).trim();
      return str.length ? str : fallback;
    }

    function getDomain(url) {
      try {
        const parsed = new URL(url);
        return parsed.hostname.replace('www.', '');
      } catch { return ''; }
    }

    function sourceFavicon(domain) {
      return `https://www.google.com/s2/favicons?domain=${domain}&sz=32`;
    }

    function langBadge(lang) {
      if (lang === 'ar') {
        return `<span class="badge bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400 text-[10px] px-1.5 py-0.5 rounded-full font-medium" title="عربي">عربي</span>`;
      }
      return `<span class="badge bg-sky-100 dark:bg-sky-900/30 text-sky-700 dark:text-sky-400 text-[10px] px-1.5 py-0.5 rounded-full font-medium" title="English">EN</span>`;
    }

    function isBookmarked(link) {
      return bookmarks.some(b => b.link === link);
    }

    function toggleBookmark(item) {
      const idx = bookmarks.findIndex(b => b.link === item.link);
      if (idx > -1) {
        bookmarks.splice(idx, 1);
        showToast('تم إزالة المقال من القراءة لاحقاً', 'info');
      } else {
        bookmarks.push({
          title: item.title,
          link: item.link,
          source: item.source,
          saved_at: Date.now()
        });
        showToast('تم حفظ المقال للقراءة لاحقاً', 'success');
      }
      localStorage.setItem('lmn-bookmarks', JSON.stringify(bookmarks));
      updateBookmarkCount();
    }

    function updateBookmarkCount() {
      const el = document.getElementById('bookmark-count');
      if (el) el.textContent = bookmarks.length;
    }

    // ===================== TOAST =====================
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const colors = {
        success: 'bg-emerald-500 text-white',
        info: 'bg-slate-700 text-white dark:bg-slate-300 dark:text-slate-900',
        warning: 'bg-amber-500 text-white',
      };
      toast.className = `px-4 py-2.5 rounded-xl shadow-lg text-sm font-medium toast-enter ${colors[type] || colors.info}`;
      toast.textContent = message;
      container.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; toast.style.transition = 'opacity 0.3s'; setTimeout(() => toast.remove(), 300); }, 2500);
    }

    // ===================== THEME =====================
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const root = document.documentElement;

    function applyTheme(mode) {
      if (mode === 'dark') {
        root.classList.add('dark');
        themeIcon.textContent = '☀️';
      } else {
        root.classList.remove('dark');
        themeIcon.textContent = '🌙';
      }
      localStorage.setItem('lmn-theme', mode);
    }

    (function initTheme() {
      const saved = localStorage.getItem('lmn-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      // Auto-switch based on time: dark from 6PM-6AM
      const hour = new Date().getHours();
      const timeDark = hour >= 18 || hour < 6;
      applyTheme(saved || (prefersDark ? 'dark' : 'light'));
      // Override to time-based if no saved preference
      if (!saved) {
        applyTheme(timeDark ? 'dark' : 'light');
      }
    })();

    themeToggle.addEventListener('click', () => {
      const isDark = root.classList.contains('dark');
      applyTheme(isDark ? 'light' : 'dark');
    });

    // ===================== LIVE CLOCK =====================
    function tickClock() {
      const el = document.getElementById('live-clock');
      if (el) el.textContent = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    }
    tickClock();
    setInterval(tickClock, 1000);

    // ===================== RELATIVE TIME =====================
    function relativeTimeAr(iso) {
      const diffMs = Date.now() - new Date(iso).getTime();
      const min = Math.floor(diffMs / 60000);
      if (min < 1) return 'الآن';
      if (min < 60) return `منذ ${min} ${min === 1 ? 'دقيقة' : min === 2 ? 'دقيقتين' : min <= 10 ? 'دقائق' : 'دقيقة'}`;
      const hrs = Math.floor(min / 60);
      if (hrs < 24) return `منذ ${hrs} ${hrs === 1 ? 'ساعة' : hrs === 2 ? 'ساعتين' : hrs <= 10 ? 'ساعات' : 'ساعة'}`;
      const days = Math.floor(hrs / 24);
      return `منذ ${days} ${days === 1 ? 'يوم' : days === 2 ? 'يومين' : days <= 10 ? 'أيام' : 'يوماً'}`;
    }

    // ===================== SHARE =====================
    async function shareNews(item) {
      const shareData = {
        title: item.title,
        text: item.summary ? item.summary.substring(0, 100) + '...' : '',
        url: item.link,
      };
      if (navigator.share) {
        try {
          await navigator.share(shareData);
        } catch { /* user cancelled */ }
      } else {
        try {
          await navigator.clipboard.writeText(item.link);
          showToast('تم نسخ الرابط', 'success');
        } catch {
          showToast('تعذّر النسخ', 'warning');
        }
      }
    }

    // ===================== RENDER: TICKER =====================
    function renderTicker(items) {
      const tickerEl = document.getElementById('ticker');
      const breaking = items.filter(n => n.breaking);
      const source = breaking.length ? breaking : items.slice(0, 4);
      const strip = source.map(n =>
        `<span class="px-6 py-0 inline-flex items-center gap-2"><span class="text-signal">●</span> ${n.title}<span class="opacity-50">•</span></span>`
      ).join('');
      tickerEl.innerHTML = strip + strip;
    }

    // ===================== RENDER: CATEGORY FILTERS =====================
    function renderCategoryFilters() {
      const cats = ['الكل', ...new Set(allNews.map(n => safeText(n.category, 'عام')))];
      const wrap = document.getElementById('category-filters');
      wrap.innerHTML = cats.map(cat => {
        const active = cat === activeCategory;
        return `<button data-cat="${cat}"
          class="cat-pill px-3.5 h-9 rounded-full border transition font-medium text-sm
          ${active
            ? 'bg-ink text-white dark:bg-white dark:text-ink border-transparent shadow-sm'
            : 'border-black/10 dark:border-white/15 hover:bg-black/5 dark:hover:bg-white/10 text-ink dark:text-ink-light'}"
          aria-pressed="${active}">
          ${cat}
        </button>`;
      }).join('');

      wrap.querySelectorAll('.cat-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          activeCategory = btn.dataset.cat;
          showBookmarksOnly = false;
          renderCategoryFilters();
          renderGrid();
        });
      });
    }

    // ===================== RENDER: CARD =====================
    function newsCard(n, index) {
      const category = safeText(n.category, 'عام');
      const source = safeText(n.source, 'مصدر غير محدد');
      const domain = safeText(n.domain, '');
      const style = CATEGORY_STYLES[category] || DEFAULT_STYLE;
      const bookmarked = isBookmarked(n.link);
      const delay = (index % visibleCount) * 30;

      return `
      <article class="card-enter group relative flex flex-col rounded-2xl border border-black/10 dark:border-white/10 bg-white dark:bg-surface p-5 hover:shadow-card-hover hover:-translate-y-0.5 transition-all duration-200
        ${n.breaking ? 'ring-1 ring-signal/30' : ''}"
        style="animation-delay: ${delay}ms" tabindex="0" role="article"
        aria-label="${n.title}">

        ${n.breaking ? `<span class="absolute -top-2.5 right-5 bg-signal text-white text-[11px] font-display font-800 px-2.5 py-1 rounded-full shadow-sm z-10">⚡ عاجل</span>` : ''}

        <!-- Top bar: favicon + lang + category -->
        <div class="flex items-center gap-2 mb-3">
          ${domain ? `<img src="${sourceFavicon(domain)}" alt="" class="w-6 h-6 rounded object-contain" loading="lazy" />` : ''}
          <span class="w-1.5 h-1.5 rounded-full ${style.dot}"></span>
          <span class="text-xs font-semibold ${style.text}">${category}</span>
          <span class="mr-auto">${langBadge(n.lang)}</span>
        </div>

        <!-- Title -->
        <h2 class="font-display font-800 text-base leading-snug mb-2 clamp-2 ${n.breaking ? 'text-signal' : ''}">${n.title}</h2>

        <!-- Summary -->
        <p class="text-sm text-ink/70 dark:text-ink-light/70 leading-relaxed clamp-3 mb-4">${n.summary}</p>

        <!-- Footer: time, source, actions -->
        <div class="mt-auto flex items-center justify-between gap-2 pt-3 border-t border-black/5 dark:border-white/5">
          <span class="text-[11px] text-slate-soft font-mono-num">${relativeTimeAr(n.published)}</span>
          <div class="flex items-center gap-1">
            <!-- Bookmark -->
            <button class="share-btn-bookmark w-8 h-8 grid place-items-center rounded-lg hover:bg-black/5 dark:hover:bg-white/10 transition"
              data-link="${n.link}" title="${bookmarked ? 'إزالة من الحفظ' : 'حفظ للقراءة لاحقاً'}"
              aria-label="${bookmarked ? 'إزالة من الحفظ' : 'حفظ للقراءة لاحقاً'}">
              ${bookmarked ? '<span class="text-amber-500">🔖</span>' : '<span class="text-slate-soft hover:text-amber-500 transition">🔖</span>'}
            </button>
            <!-- Share -->
            <button class="share-btn w-8 h-8 grid place-items-center rounded-lg hover:bg-black/5 dark:hover:bg-white/10 transition"
              data-link="${n.link}" data-title="${n.title.replace(/"/g, '"')}"
              title="مشاركة" aria-label="مشاركة">
              <span class="text-slate-soft">📤</span>
            </button>
          </div>
        </div>
      </article>`;
    }

    // ===================== RENDER: GRID =====================
    function renderGrid() {
      const grid = document.getElementById('news-grid');
      const empty = document.getElementById('empty-state');
      const bookmarkEmpty = document.getElementById('bookmark-empty-state');
      const countEl = document.getElementById('result-count');
      const loadMoreWrap = document.getElementById('load-more-wrapper');

      let items = allNews;

      // Filter by bookmarks
      if (showBookmarksOnly) {
        items = items.filter(n => isBookmarked(n.link));
      }

      // Filter by category
      if (activeCategory !== 'الكل') {
        items = items.filter(n => safeText(n.category, 'عام') === activeCategory);
      }

      // Filter by search
      if (searchTerm) {
        const st = searchTerm.toLowerCase();
        items = items.filter(n => {
          const haystack = `${n.title || ''} ${n.summary || ''} ${n.source || ''}`.toLowerCase();
          return haystack.includes(st);
        });
      }

      // Sort by published (newest first)
      items.sort((a, b) => new Date(b.published) - new Date(a.published));

      filteredNews = items;

      // Paginate
      const visible = items.slice(0, visibleCount);

      countEl.textContent = `${items.length} خبر`;

      if (!items.length) {
        grid.innerHTML = '';
        if (showBookmarksOnly) {
          bookmarkEmpty.classList.remove('hidden');
          bookmarkEmpty.classList.add('flex');
          empty.classList.add('hidden');
        } else {
          empty.classList.remove('hidden');
          empty.classList.add('flex');
          bookmarkEmpty.classList.add('hidden');
        }
        loadMoreWrap.classList.add('hidden');
        return;
      }

      grid.classList.remove('hidden');
      empty.classList.add('hidden');
      empty.classList.remove('flex');
      bookmarkEmpty.classList.add('hidden');
      bookmarkEmpty.classList.remove('flex');

      // Render visible cards
      grid.innerHTML = visible.map((n, i) => newsCard(n, i)).join('');

      // Show/hide load more
      if (items.length > visibleCount) {
        loadMoreWrap.classList.remove('hidden');
      } else {
        loadMoreWrap.classList.add('hidden');
      }

      // Attach event listeners to new cards
      attachCardListeners();
    }

    function attachCardListeners() {
      // Bookmark buttons
      document.querySelectorAll('.share-btn-bookmark').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          const item = allNews.find(n => n.link === btn.dataset.link);
          if (item) toggleBookmark(item);
        });
      });

      // Share buttons
      document.querySelectorAll('.share-btn').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.preventDefault();
          const item = allNews.find(n => n.link === btn.dataset.link);
          if (item) await shareNews(item);
        });
      });
    }

    // ===================== SEARCH =====================
    const searchInput = document.getElementById('search-input');
    const clearBtn = document.getElementById('clear-search');
    let searchDebounce;

    searchInput.addEventListener('input', (e) => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(() => {
        searchTerm = e.target.value.trim();
        visibleCount = 18; // reset pagination on search
        if (clearBtn) clearBtn.classList.toggle('hidden', !searchTerm);
        renderGrid();
      }, 150);
    });

    if (clearBtn) {
      clearBtn.addEventListener('click', () => {
        searchInput.value = '';
        searchTerm = '';
        visibleCount = 18;
        clearBtn.classList.add('hidden');
        renderGrid();
        searchInput.focus();
      });
    }

    // Keyboard shortcut: Ctrl+K to focus search
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
        e.preventDefault();
        searchInput.focus();
        searchInput.select();
      }
    });

    // ===================== LOAD MORE =====================
    document.getElementById('load-more-btn')?.addEventListener('click', () => {
      visibleCount += 12;
      renderGrid();
    });

    // ===================== BOOKMARK FILTER =====================
    document.getElementById('bookmark-filter-btn')?.addEventListener('click', () => {
      showBookmarksOnly = !showBookmarksOnly;
      activeCategory = 'الكل';
      const btn = document.getElementById('bookmark-filter-btn');
      btn.classList.toggle('bg-ink', showBookmarksOnly);
      btn.classList.toggle('text-white', showBookmarksOnly);
      btn.classList.toggle('dark:bg-white', showBookmarksOnly);
      btn.classList.toggle('dark:text-ink', showBookmarksOnly);
      visibleCount = 18;
      renderCategoryFilters();
      renderGrid();
    });

    // ===================== SKELETON WHILE LOADING =====================
    function renderSkeleton() {
      const grid = document.getElementById('news-grid');
      grid.innerHTML = Array.from({ length: 6 }).map(() => `
        <div class="rounded-2xl border border-black/10 dark:border-white/10 p-5 bg-white dark:bg-surface">
          <div class="shimmer h-3 w-20 rounded mb-4"></div>
          <div class="shimmer h-4 w-full rounded mb-2"></div>
          <div class="shimmer h-4 w-3/4 rounded mb-4"></div>
          <div class="shimmer h-3 w-full rounded mb-1.5"></div>
          <div class="shimmer h-3 w-5/6 rounded"></div>
        </div>`).join('');
    }

    // ===================== FETCH & INIT =====================
    async function loadNews() {
      renderSkeleton();
      try {
        const res = await fetch('news.json?v=' + new Date().getTime());
        if (!res.ok) throw new Error('تعذّر تحميل الأخبار');
        allNews = await res.json();
        renderTicker(allNews);
        renderCategoryFilters();
        renderGrid();
        updateBookmarkCount();

        // Show last update
        const lastUpdateEl = document.getElementById('last-update');
        if (lastUpdateEl && allNews.length) {
          const maxTs = Math.max(...allNews.map(n => n.fetched_at || 0));
          if (maxTs) {
            const d = new Date(maxTs * 1000);
            lastUpdateEl.textContent = `آخر تحديث: ${d.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' })}`;
          }
        }
      } catch (err) {
        document.getElementById('news-grid').innerHTML = `
          <div class="col-span-full text-center py-16">
            <div class="text-4xl mb-3">⚠️</div>
            <p class="font-display font-700 mb-1">تعذّر تحميل الأخبار</p>
            <p class="text-sm text-slate-soft">تأكد من الاتصال بالإنترنت.</p>
            <button onclick="loadNews()" class="mt-4 px-4 py-2 bg-signal text-white rounded-xl text-sm font-medium hover:opacity-90 transition">إعادة المحاولة</button>
          </div>`;
        console.error(err);
      }
    }

    // Refresh relative timestamps every 60s without refetching
    setInterval(() => { if (allNews.length) renderGrid(); }, 60000);

    // Initial load
    loadNews();
  </script>
</body>
</html>
